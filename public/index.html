<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Product Catalog</title>
<link rel="stylesheet" href="css/index.css">
</head>
<body>

  <nav>
    <span class="brand">Far.R.M 102</span>
    <a href="index.html" aria-current="page">Gallery</a>
    <a href="form.html">Caption</a>
  </nav>

  <header>
    <div class="eyebrow">Shelf No. 01 — Digital Store</div>
    <h1>Gallery</h1>
    <p>product data is fetched directly from dummyjson.com/products</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search products...">
    <select id="categorySelect">
      <option value="">All Categories</option>
    </select>
    <button type="button" id="reloadBtn" class="ghost">Reload</button>
  </div>

  <main>
    <div id="status">Loading products...</div>
    <p id="count" aria-live="polite"></p>
    <div class="grid" id="productGrid"></div>
  </main>

  <footer>
    data source: dummyjson.com &middot; built with native HTML + JS
  </footer>

<script src="js/index.js"></script>
</body>
</html>
